<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Speed Boat Race</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#c8d9e6;font-family:Arial,Helvetica,sans-serif}
canvas{display:block}
#dash{position:fixed;left:0;top:0;pointer-events:none;display:none}
#hud{position:fixed;left:14px;top:12px;color:#fff;font-size:18px;font-weight:600;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:8px;pointer-events:none;z-index:3}
#camb{position:fixed;right:14px;top:12px;color:#fff;font-size:16px;font-weight:600;background:rgba(0,0,0,.5);padding:8px 12px;border:0;border-radius:8px;cursor:pointer;z-index:3}
#warn{position:fixed;left:50%;top:70px;transform:translateX(-50%);display:none;color:#111;font-size:22px;font-weight:700;background:rgba(240,170,0,.9);padding:6px 18px;border-radius:8px;pointer-events:none;z-index:3}
#cd{position:fixed;left:0;right:0;top:30%;text-align:center;color:#fff;font-size:110px;font-weight:700;text-shadow:0 4px 14px rgba(0,0,0,.6);pointer-events:none;z-index:3}
#strip{position:fixed;left:50%;bottom:14px;width:min(70vw,760px);margin-left:calc(min(70vw,760px)/-2);height:20px;pointer-events:none;z-index:3}
#strip .bar{position:absolute;left:8px;right:8px;top:8px;height:4px;background:rgba(0,0,0,.55);border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
#strip .dot{position:absolute;top:4px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;text-align:center;z-index:5}
#start h1{font-size:56px;margin:0 0 8px}
#start p{font-size:18px;margin:4px 0}
#go{margin-top:18px;font-size:22px;padding:12px 34px;border:0;border-radius:10px;background:#e8501f;color:#fff;cursor:pointer}
#res{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.6);color:#fff;text-align:center;z-index:5}
#res h1{font-size:54px;margin:0 0 10px}
#res .row{font-size:24px;margin:5px 0;min-width:340px;text-align:left;padding:6px 14px;border-radius:8px;background:rgba(255,255,255,.12)}
#res button{margin-top:20px;font-size:22px;padding:12px 34px;border:0;border-radius:10px;background:#e8501f;color:#fff;cursor:pointer}
#res.many .row{font-size:19px;margin:3px 0;padding:4px 12px}
#res.many h1{font-size:40px}
.sel{margin-top:14px;font-size:18px}.sel select{font-size:18px;padding:4px 8px}
</style>
</head>
<body>
<canvas id="dash"></canvas>
<div id="hud"></div>
<button id="camb"></button>
<div id="warn"></div>
<div id="cd"></div>
<div id="strip"></div>
<div id="start">
<h1>Speed Boat Race</h1>
<p>10 mile lake course &nbsp;•&nbsp; follow the pylons</p>
<p>Arrow keys or WASD: up = throttle, down = brake / reverse, left and right = steer</p>
<p>C = switch cockpit / behind view &nbsp;•&nbsp; R = restart</p>
<div class="sel">Boats in the race: <select id="ncar"><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
<button id="go">Start</button>
</div>
<div id="res"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function makeCat(bodyCol,num,teamTxt){
const root=new THREE.Group(),b=new THREE.Group();root.add(b);const canopy=[];
const L=11,z0=-5.5,N=58,B=1.55,TN=0.86;
const pink=new THREE.Color(bodyCol),gray=new THREE.Color(0x232a33),under=new THREE.Color(0x14171c),roof=new THREE.Color(0x1e232a),pinkTop=pink.clone().lerp(gray,0.55);
const sm=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
function prof(t){const f=t<0.4?Math.pow(Math.sin(t/0.4*Math.PI/2),0.95):1;const w=Math.max(0.05,B*f*(t>0.93?1-0.03*(t-0.93)/0.07:1));
const yc=0.32*Math.pow(Math.max(0,1-t/0.55),2);const yk=yc-0.38*Math.min(1,w/B*1.25);const ys=yc+0.78+0.42*Math.pow(1-t,3);const g=sm((t-0.26)/0.3);
return{z:z0+L*t,w:w,yc:yc,yk:yk,ys:ys,g:g,bs:w*1.02};}
const P=[];for(let i=0;i<N;i++)P.push(prof(i/(N-1)));
function ring(p){const g=p.g,w=p.w;const ke=0.6*w*g,inx=0.2*w*g;const iy=p.yk+(p.yc+0.04-p.yk)*g,ty=p.yk+(p.yc+0.3-p.yk)*g;
return[[-p.bs,p.ys],[-w*0.97,p.yc],[-ke,p.yk],[-inx,iy],[0,ty],[inx,iy],[ke,p.yk],[w*0.97,p.yc],[p.bs,p.ys]];}
const rings=P.map(ring);
const SC=[[pinkTop,pink],[under,under],[under,under],[roof,roof],[roof,roof],[under,under],[under,under],[pink,pinkTop]];
const pos=[],col=[],idx=[];let vc=0;
for(let s=0;s<8;s++){const base=vc;for(let i=0;i<N;i++){for(let k=0;k<2;k++){const r=rings[i][s+k],c=SC[s][k];pos.push(r[0],r[1],P[i].z);col.push(c.r,c.g,c.b);vc++;}}
for(let i=0;i<N-1;i++){const a=base+i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}}
const hg=new THREE.BufferGeometry();hg.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));hg.setAttribute('color',new THREE.Float32BufferAttribute(col,3));hg.setIndex(idx);hg.computeVertexNormals();
b.add(new THREE.Mesh(hg,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.25,metalness:0.2,side:THREE.DoubleSide})));
// deck texture
const cw=512,ch=1024,cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const x=cv.getContext('2d');
const hexs='#'+('000000'+bodyCol.toString(16)).slice(-6);
const hwAt=y=>{const t=y/ch;const p=prof(Math.min(1,Math.max(0,t)));return p.bs/(2*B*1.06)*cw;};
x.fillStyle='#1d222b';x.fillRect(0,0,cw,ch);
for(let y=0;y<ch;y++){const hw=hwAt(y),cx=cw/2;const g=x.createLinearGradient(cx-hw,0,cx+hw,0);g.addColorStop(0,hexs);g.addColorStop(0.22,'#26303b');g.addColorStop(0.5,'#2b3440');g.addColorStop(0.78,'#26303b');g.addColorStop(1,hexs);x.fillStyle=g;x.fillRect(cx-hw,y,hw*2,1.5);}
x.lineCap='round';
function stripe(f,wd,colr,y0,y1){x.strokeStyle=colr;x.lineWidth=wd;[-1,1].forEach(sd=>{x.beginPath();for(let y=y0;y<=y1;y+=8){const px=cw/2+sd*f*hwAt(y);if(y===y0)x.moveTo(px,y);else x.lineTo(px,y);}x.stroke();});}
stripe(0.80,5,'#ffffff',20,990);stripe(0.7,2.5,hexs,20,990);stripe(0.52,3.5,'#e8eef5',210,990);stripe(0.42,2,hexs,260,990);
// hex pattern
x.strokeStyle='rgba(170,190,220,0.16)';x.lineWidth=1;for(let r=0;r<40;r++)for(let c=0;c<14;c++){const hx=40+c*30+(r%2?15:0),hy=420+r*13;if(Math.abs(hx-cw/2)<hwAt(hy)*0.5&&Math.abs(hx-cw/2)>hwAt(hy)*0.16){x.beginPath();for(let k=0;k<6;k++){const a=k*Math.PI/3;x.lineTo(hx+9*Math.cos(a),hy+9*Math.sin(a)*0.9);}x.closePath();x.stroke();}}
// hatch outlines
x.strokeStyle='rgba(210,220,235,0.45)';x.lineWidth=2;[-1,1].forEach(sd=>{const px=cw/2+sd*hwAt(720)*0.52;x.strokeRect(px-42,660,84,170);});
// V chevrons
[-1,1].forEach(sd=>{x.strokeStyle='#ffffff';x.lineWidth=4;x.beginPath();x.moveTo(cw/2+sd*hwAt(900)*0.78,960);x.lineTo(cw/2+sd*hwAt(640)*0.30,640);x.stroke();x.strokeStyle=hexs;x.lineWidth=2.5;x.beginPath();x.moveTo(cw/2+sd*hwAt(900)*0.70,960);x.lineTo(cw/2+sd*hwAt(640)*0.24,650);x.stroke();});
// number and name
x.fillStyle='#fff';x.font='italic bold 130px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(num,cw/2,190);x.font='italic bold 30px Arial';x.fillText(teamTxt||'TURBO RACING',cw/2,282);
const dtex=new THREE.CanvasTexture(cv);dtex.anisotropy=4;
const dmat=new THREE.MeshStandardMaterial({map:dtex,roughness:0.3,metalness:0.15,side:THREE.DoubleSide});
function strip(i0,i1,uA,uB,mat){const n=7,dp=[],uv=[],di=[];for(let i=i0;i<=i1;i++){const p=P[i];for(let k=0;k<n;k++){const u=uA+(uB-uA)*k/(n-1);const px=u*p.bs,py=p.ys+0.07*(1-u*u);dp.push(px,py,p.z);uv.push(px/(2*B*1.06)+0.5,1-(p.z-z0)/L);}}
const rows=i1-i0+1;for(let i=0;i<rows-1;i++)for(let k=0;k<n-1;k++){const a=i*n+k;di.push(a,a+1,a+n,a+1,a+n+1,a+n);}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(dp,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(di);g.computeVertexNormals();const m=new THREE.Mesh(g,mat);b.add(m);return m;}
const iN=Math.round(TN*(N-1));strip(0,iN,-1,1,dmat);strip(iN,N-1,-1,-0.42,dmat);strip(iN,N-1,0.42,1,dmat);
// transom/notch walls (dark)
const dk=new THREE.MeshStandardMaterial({color:0x101216,roughness:0.5,metalness:0.3}),lit=new THREE.MeshStandardMaterial({color:0x2c3440,roughness:0.35,metalness:0.4});
// canopy
const cz=-0.1,cy=P[Math.round(0.48*(N-1))].ys+0.06;
const base=new THREE.Mesh(new THREE.SphereGeometry(1,24,10,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0x0b0d10,roughness:0.4,metalness:0.5}));base.scale.set(0.76,0.18,1.9);base.position.set(0,cy,cz);b.add(base);canopy.push(base);
const dome=new THREE.Mesh(new THREE.SphereGeometry(1,28,14,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0x0e1822,roughness:0.08,metalness:0.85}));dome.scale.set(0.66,0.72,1.75);dome.position.set(0,cy+0.05,cz);b.add(dome);canopy.push(dome);
const gl=new THREE.MeshStandardMaterial({color:0x4a6684,roughness:0.05,metalness:0.6,});
[-1,1].forEach(sd=>{const w=new THREE.Mesh(new THREE.SphereGeometry(1,16,8,0,Math.PI*2,0,Math.PI/2),gl);w.scale.set(0.655,0.5,0.9);w.position.set(0,cy+0.05,cz+0.35);w.scale.x=0.655;b.add(w);canopy.push(w);});
const fw=new THREE.Mesh(new THREE.SphereGeometry(1,18,8,0,Math.PI*2,0,Math.PI/2),gl);fw.scale.set(0.5,0.52,0.55);fw.position.set(0,cy+0.1,cz-1.1);fw.rotation.x=0.18;b.add(fw);canopy.push(fw);
// engine bay hump, hatches, louvers
const bay=new THREE.Mesh(new THREE.SphereGeometry(1,20,10,0,Math.PI*2,0,Math.PI/2),lit);bay.scale.set(0.55,0.2,1.6);bay.position.set(0,P[Math.round(0.7*(N-1))].ys+0.06,2.0);b.add(bay);
for(let k=0;k<5;k++){const sl=new THREE.Mesh(new THREE.BoxGeometry(0.62-k*0.04,0.035,0.1),dk);sl.position.set(0,P[Math.round(0.7*(N-1))].ys+0.2+k*0.012,1.45+k*0.19);sl.rotation.x=-0.5;b.add(sl);}
[-1,1].forEach(sd=>{const h=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.05,1.0),lit);h.position.set(sd*0.95,P[Math.round(0.75*(N-1))].ys+0.1,2.3);b.add(h);
const sc=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.1,0.5),dk);sc.position.set(sd*0.5,P[Math.round(0.68*(N-1))].ys+0.1,1.5);sc.rotation.z=-sd*0.3;b.add(sc);});
// bow blades
[-1,1].forEach(sd=>{const sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(0.7,0);sh.lineTo(0,0.35);const g=new THREE.ExtrudeGeometry(sh,{depth:0.04,bevelEnabled:false});const m=new THREE.Mesh(g,dk);const pb=P[3];m.position.set(sd*pb.bs*0.9,pb.ys-0.05,pb.z);m.rotation.y=sd>0?Math.PI/2:-Math.PI/2;m.rotation.x=0;m.scale.set(1,1,1);b.add(m);});
// stern: ride plate and engines
const pe=P[N-1];
const plate=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.05,1.0),dk);plate.position.set(0,pe.yc+0.1,pe.z-0.2);b.add(plate);
[-1,1].forEach(sd=>{const f=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.3,0.9),dk);f.position.set(sd*0.7,pe.yc+0.22,pe.z-0.2);b.add(f);});
const eng=new THREE.MeshStandardMaterial({color:0x15171a,roughness:0.35,metalness:0.5}),steel=new THREE.MeshStandardMaterial({color:0xb7bcc4,roughness:0.3,metalness:0.8}),accM=new THREE.MeshStandardMaterial({color:bodyCol,roughness:0.4}),props=[];
[-1,1].forEach(sd=>{const e=new THREE.Group();
const co=new THREE.Mesh(new THREE.SphereGeometry(0.42,18,12),eng);co.scale.set(0.8,0.85,1.15);co.position.set(0,pe.ys-0.05,0.35);e.add(co);
const ac=new THREE.Mesh(new THREE.SphereGeometry(0.425,18,12,0,Math.PI*2,0,Math.PI*0.18),accM);ac.scale.set(0.8,0.85,1.15);ac.position.copy(co.position);e.add(ac);
const lg=new THREE.Mesh(new THREE.BoxGeometry(0.26,1.0,0.5),eng);lg.position.set(0,pe.ys-0.52,0.42);e.add(lg);
const gc=new THREE.Mesh(new THREE.SphereGeometry(0.18,12,10),eng);gc.scale.set(1,0.95,2.1);gc.position.set(0,pe.ys-1.02,0.45);e.add(gc);
const pr=new THREE.Group();for(let k=0;k<4;k++){const bl=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.44,0.12),steel);bl.position.y=0.22;const g2=new THREE.Group();g2.add(bl);g2.rotation.z=k*Math.PI/2;pr.add(g2);}
pr.position.set(0,pe.ys-1.02,0.88);e.add(pr);props.push(pr);
e.position.set(sd*1.05,0,pe.z);b.add(e);});
// side graphics
function tcv(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');fn(g,w,h);return new THREE.CanvasTexture(c);}
const nt=tcv(512,128,(g,w,h)=>{g.fillStyle='#fff';g.font='italic bold 100px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(num,95,68);g.font='italic bold 52px Arial';g.fillText(teamTxt||'TURBO RACING',330,70);});
const nm=new THREE.MeshBasicMaterial({map:nt,transparent:true,side:THREE.DoubleSide});
const pn=P[Math.round(0.66*(N-1))];
[-1,1].forEach(sd=>{const pl=new THREE.Mesh(new THREE.PlaneGeometry(3.0,0.75),nm);const k=0.55,xx=pn.bs+(pn.w*0.97-pn.bs)*k,yy=pn.ys+(pn.yc-pn.ys)*k,dx=pn.w*0.97-pn.bs,dy=pn.yc-pn.ys;
const nrm=new THREE.Vector3(sd*(-dy),dx,0).normalize();pl.position.set(sd*xx,yy,pn.z).addScaledVector(nrm,0.015);pl.lookAt(pl.position.clone().add(nrm));if(sd<0)pl.rotation.z+=0;b.add(pl);});
b.scale.x=1.2;b.traverse(o=>{if(o.isMesh)o.castShadow=true;});
root.userData.props=props;root.userData.canopy=canopy;return root;}

const hud=document.getElementById('hud'),cdEl=document.getElementById('cd'),startEl=document.getElementById('start'),resEl=document.getElementById('res'),stripEl=document.getElementById('strip'),cambEl=document.getElementById('camb'),dashC=document.getElementById('dash'),dctx=dashC.getContext('2d');
let W=innerWidth,HP=innerHeight;const PR=Math.min(window.devicePixelRatio||1,2);
const FOGC=0xc8d9e6,FN=150,FF=2200;
const scene=new THREE.Scene();scene.fog=new THREE.Fog(FOGC,FN,FF);
const cam=new THREE.PerspectiveCamera(65,W/HP,0.5,9000);cam.rotation.order='YXZ';
const ren=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:!!window.__TEST});
ren.setSize(W,HP);ren.setPixelRatio(PR);document.body.insertBefore(ren.domElement,document.body.firstChild);
scene.add(cam);
const hemi=new THREE.HemisphereLight(0xdce9f7,0x3c4a3a,0.95);scene.add(hemi);
const SUN=new THREE.Vector3(0.42,0.5,-0.76).normalize();
const sun=new THREE.DirectionalLight(0xfff0d8,0.95);scene.add(sun);scene.add(sun.target);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smooth=(a,b,x)=>{let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);};
const lerp=(a,b,t)=>a+(b-a)*t;
const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
function h2(a,b){let n=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263))|0;n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return (n>>>0)/4294967296;}
function vn(x,z){const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz,sx=fx*fx*(3-2*fx),sz=fz*fz*(3-2*fz);const a=h2(ix,iz),b=h2(ix+1,iz),c=h2(ix,iz+1),d=h2(ix+1,iz+1);const p=a+(b-a)*sx;return p+((c+(d-c)*sx)-p)*sz;}
function fbm(x,z,o){let a=0.5,s=0,f=1,n=0;for(let i=0;i<o;i++){s+=a*vn(x*f+i*17.3,z*f-i*9.1);n+=a;a*=0.5;f*=2.03;}return s/n;}
/* ---------- course: 10 miles ---------- */
const MILE=1609.344,L=MILE*10,S0=-500,SP=10,S1=L+1000,NPT=Math.round((S1-S0)/SP)+1;
const PX=new Float32Array(NPT),PZ=new Float32Array(NPT),PH=new Float32Array(NPT);
const PST=2,PSN=Math.ceil((S1-S0)/PST)+4,PSIT=new Float32Array(PSN);
(function(){const ev=[];let pos=700,cum=0,prev=1;for(let n=0;n<60&&pos<S1+500;n++){const ang=1.0+h2(n,5)*0.7,R=120+h2(n,6)*60;let sg=h2(n,9)<0.35?prev:-prev;if(Math.abs(cum+sg*ang)>1.45)sg=-sg;cum+=sg*ang;prev=sg;const len=R*ang;ev.push([pos,pos+len,sg/R]);pos+=len+350+h2(n,7)*550;}
let psi=0;for(let i=0;i<PSN;i++){const s=S0+i*PST;PSIT[i]=psi;let k=0;for(let j=0;j<ev.length;j++){const e=ev[j];if(s>=e[0]-30&&s<=e[1]+30)k+=e[2]*smooth(e[0]-30,e[0]+30,s)*(1-smooth(e[1]-30,e[1]+30,s));}psi+=k*PST;}})();
function psiF(s){const f=(s-S0)/PST;let i=Math.floor(f);i=clamp(i,0,PSN-2);return PSIT[i]+(PSIT[i+1]-PSIT[i])*clamp(f-i,0,1);}
(function(){const i0=Math.round(-S0/SP);PX[i0]=0;PZ[i0]=0;PH[i0]=psiF(0);
for(let i=i0+1;i<NPT;i++){const s=S0+i*SP,pm=psiF(s-SP/2);PX[i]=PX[i-1]+Math.sin(pm)*SP;PZ[i]=PZ[i-1]-Math.cos(pm)*SP;PH[i]=psiF(s);}
for(let i=i0-1;i>=0;i--){const s=S0+i*SP,pm=psiF(s+SP/2);PX[i]=PX[i+1]-Math.sin(pm)*SP;PZ[i]=PZ[i+1]+Math.cos(pm)*SP;PH[i]=psiF(s);}})();
let CX=0,CZ=0,CHd=0;
function cpt(s){const f=(s-S0)/SP;let i=Math.floor(f);i=clamp(i,0,NPT-2);const t=clamp(f-i,0,1);CX=PX[i]+(PX[i+1]-PX[i])*t;CZ=PZ[i]+(PZ[i+1]-PZ[i])*t;CHd=PH[i]+(PH[i+1]-PH[i])*t;}
const BAYS=[[2400,130,260,1],[5200,110,300,-1],[7900,150,320,1],[10800,120,280,-1],[13400,140,300,1],[15600,100,260,-1]];
function lakeW(s){let w=270+45*Math.sin(s/950+1.3)+35*Math.sin(s/330+0.4);for(let k=0;k<BAYS.length;k++){const b=BAYS[k],t=(s-b[0])/b[2];w+=b[1]*Math.exp(-t*t);}return w;}
function lakeSh(s){let v=45*Math.sin(s/700+0.5)*smooth(-300,400,s);for(let k=0;k<BAYS.length;k++){const b=BAYS[k],t=(s-b[0])/b[2];v+=b[3]*b[1]*0.8*Math.exp(-t*t);}return v;}
/* distance field to course */
